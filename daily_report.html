<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Study Report 작성기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group label .required {
            color: #e74c3c;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .report-output {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 14px;
            border: 1px solid #e9ecef;
            max-height: 500px;
            overflow-y: auto;
        }

        .copy-notice {
            text-align: center;
            color: #27ae60;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }

        .copy-notice.show {
            display: block;
        }

        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .form-group {
                min-width: 100%;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Daily Study Report 작성기</h1>
            <p>학생 정보를 입력하면 AI가 자동으로 보고서를 생성합니다</p>
        </div>

        <div class="card">
            <h2>학생 정보 입력</h2>

            <div class="form-row">

                    <input type="text" id="name" placeholder="예: 홍길동">
                </div>
                <div class="form-group">
                    <label>사용 교재 <span class="required">*</span></label>
                    <input type="text" id="textbook" placeholder="예: Orange 8">
                </div>
                <div class="form-group">
                    <label>학습 진도 <span class="required">*</span></label>
                    <input type="text" id="progress" placeholder="예: Day 7">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>과제수행</label>
                    <select id="homework">
                        <option value="">선택 안함</option>
                        <option value="완료">완료</option>
                        <option value="부분완료">부분완료</option>
                        <option value="미완료">미완료</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>단어</label>
                    <select id="vocabulary">
                        <option value="">선택 안함</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>본문</label>
                    <select id="reading">
                        <option value="">선택 안함</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>표현</label>
                    <select id="expression">
                        <option value="">선택 안함</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>문법</label>
                    <select id="grammar">
                        <option value="">선택 안함</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>테스트</label>
                    <select id="test">
                        <option value="">선택 안함</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="min-width: 100%;">
                    <label>특이사항</label>
                    <textarea id="notes" placeholder="수업 중 관찰한 내용, 학습 태도, 어려워한 부분, 칭찬할 점, 개선할 점 등을 입력해 주세요."></textarea>
                    <p class="info-text">특이사항에 입력한 내용이 보고서에 자동 반영됩니다.</p>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateReport()">보고서 생성</button>
                <button class="btn btn-secondary" onclick="clearForm()">초기화</button>
            </div>
        </div>

        <div id="resultSection" class="card result-section">
            <h2>생성된 보고서</h2>
            <div id="reportOutput" class="report-output"></div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="copyReport()">복사하기</button>
                <button class="btn btn-primary" onclick="generateReport()">다시 생성</button>
            </div>
            <p id="copyNotice" class="copy-notice">클립보드에 복사되었습니다!</p>
        </div>
    </div>

        function getGradeEvaluation(grade) {
            if (['A', 'A+'].includes(grade)) return '우수';
            if (['B', 'B+'].includes(grade)) return '보통';
            if (['C', 'C+', 'D', 'F'].includes(grade)) return '미흡';
            return '';
        }

        function selectRandom(arr, count) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function determinePerformanceLevel(data) {
            const grades = [];
            ['vocabulary', 'reading', 'expression', 'grammar', 'test'].forEach(key => {
                if (data[key]) {
                    if (['A', 'A+'].includes(data[key])) grades.push(3);
                    else if (['B', 'B+'].includes(data[key])) grades.push(2);
                    else grades.push(1);
                }
            });

            if (grades.length === 0) return 'good';

            const avg = grades.reduce((a, b) => a + b, 0) / grades.length;
            if (avg >= 2.5) return 'excellent';
            if (avg >= 1.5) return 'good';
            return 'needsImprovement';
        }

        function generateReport() {
            const name = document.getElementById('name').value.trim();
            const textbook = document.getElementById('textbook').value.trim();
            const progress = document.getElementById('progress').value.trim();

            if (!name || !textbook || !progress) {
                alert('학생 이름, 교재, 진도는 필수 항목입니다.');
                return;
            }

            const data = {
                name,
                textbook,
                progress,
                homework: document.getElementById('homework').value,
                vocabulary: document.getElementById('vocabulary').value,
                reading: document.getElementById('reading').value,
                expression: document.getElementById('expression').value,
                grammar: document.getElementById('grammar').value,
                test: document.getElementById('test').value,
                notes: document.getElementById('notes').value.trim()
            };

            let report = [];
            report.push(`${name} 학생 Daily Study Report 보내드립니다`);
            report.push('');
            report.push('교재 및 진도 현황');
            report.push(`사용 교재: ${textbook}`);
            report.push(`학습 진도: ${progress}`);
            report.push('');
            report.push('학습 평가 결과');
            report.push('');

            let itemNum = 1;

            if (data.homework) {
                report.push(`${itemNum}. 과제수행 완성도`);
                if (data.homework === '완료') report.push('(O) 완료 / ( ) 미완료 / ( ) 부분완료');
                else if (data.homework === '미완료') report.push('( ) 완료 / (O) 미완료 / ( ) 부분완료');
                else if (data.homework === '부분완료') report.push('( ) 완료 / ( ) 미완료 / (O) 부분완료');
                report.push('');
                itemNum++;
            }

            if (data.vocabulary) {
                report.push(`${itemNum}. 단어 테스트 결과`);
                report.push(`등급: ${data.vocabulary}`);
                report.push(`평가: ${getGradeEvaluation(data.vocabulary)}`);
                report.push('');
                itemNum++;
            }

            if (data.reading) {
                report.push(`${itemNum}. 본문 테스트 결과`);
                report.push(`등급: ${data.reading}`);
                report.push(`평가: ${getGradeEvaluation(data.reading)}`);
                report.push('');
                itemNum++;
            }

            if (data.expression) {
                report.push(`${itemNum}. 표현확장연습 결과`);
                report.push(`등급: ${data.expression}`);
                report.push(`평가: ${getGradeEvaluation(data.expression)}`);
                report.push('');
                itemNum++;
            }

            if (data.grammar) {
                report.push(`${itemNum}. 문법 테스트 결과`);
                report.push(`등급: ${data.grammar}`);
                report.push(`평가: ${getGradeEvaluation(data.grammar)}`);
                report.push('');
                itemNum++;
            }

            if (data.test) {
                report.push(`${itemNum}. 전체 테스트 결과`);
                report.push(`등급: ${data.test}`);
                report.push(`평가: ${getGradeEvaluation(data.test)}`);
                report.push('');
            }

            // 칭찬할 점
            const performanceLevel = determinePerformanceLevel(data);
            const praiseList = selectRandom(PRAISE_TEMPLATES[performanceLevel], 3);
            let praiseText = praiseList.map(p => p.replace('{name}', name)).join(' ');

            if (data.notes && /열심히|잘|좋|적극|발전|향상|훌륭/.test(data.notes)) {
                praiseText += ` 특히, ${data.notes.split('\n')[0]}`;
            }

            report.push('칭찬할 점');
            report.push(praiseText);
            report.push('');

            // 개선이 필요한 부분
            let improvementAreas = [];
            if (data.vocabulary && getGradeEvaluation(data.vocabulary) !== '우수') improvementAreas.push('vocabulary');
            if (data.reading && getGradeEvaluation(data.reading) !== '우수') improvementAreas.push('reading');
            if (data.expression && getGradeEvaluation(data.expression) !== '우수') improvementAreas.push('expression');
            if (data.grammar && getGradeEvaluation(data.grammar) !== '우수') improvementAreas.push('grammar');

            if (improvementAreas.length === 0) improvementAreas = ['general'];

            let improvementPhrases = [];
            improvementAreas.slice(0, 2).forEach(area => {
                const phrases = selectRandom(IMPROVEMENT_TEMPLATES[area], 1);
                improvementPhrases.push(...phrases);
            });

            if (improvementPhrases.length < 2) {
                improvementPhrases.push(...selectRandom(IMPROVEMENT_TEMPLATES.general, 1));
            }

            let improvementText = improvementPhrases.join(' ');

            if (data.notes && /어려|힘들|부족|실수|헷갈|혼동/.test(data.notes)) {
                const relevantNote = data.notes.split('\n').find(line => /어려|힘들|부족|실수|헷갈|혼동/.test(line));
                if (relevantNote) {
                    improvementText += ` ${relevantNote}`;
                }
            }

            report.push('개선이 필요한 부분');
            report.push(improvementText);
            report.push('');

            // 가정에서의 학습 제안
            let homeStudyPhrases = [];
            improvementAreas.slice(0, 2).forEach(area => {
                if (HOME_STUDY_TEMPLATES[area]) {
                    homeStudyPhrases.push(...selectRandom(HOME_STUDY_TEMPLATES[area], 1));
                }
            });

            homeStudyPhrases.push(...selectRandom(HOME_STUDY_TEMPLATES.encouragement, 1));

            if (homeStudyPhrases.length < 3) {
                homeStudyPhrases.push(...selectRandom(HOME_STUDY_TEMPLATES.general, 1));
            }

            report.push('가정에서의 학습 제안');
            report.push(homeStudyPhrases.join(' '));

            // 결과 표시
            const reportText = report.join('\n');
            document.getElementById('reportOutput').textContent = reportText;
            document.getElementById('resultSection').classList.add('show');
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function copyReport() {
            const reportText = document.getElementById('reportOutput').textContent;
            navigator.clipboard.writeText(reportText).then(() => {
                const notice = document.getElementById('copyNotice');
                notice.classList.add('show');
                setTimeout(() => notice.classList.remove('show'), 2000);
            }).catch(err => {
                // 대체 방법
                const textarea = document.createElement('textarea');
                textarea.value = reportText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);

                const notice = document.getElementById('copyNotice');
                notice.classList.add('show');
                setTimeout(() => notice.classList.remove('show'), 2000);
            });
        }

        function clearForm() {
            document.getElementById('name').value = '';
            document.getElementById('textbook').value = '';
            document.getElementById('progress').value = '';
            document.getElementById('homework').value = '';
            document.getElementById('vocabulary').value = '';
            document.getElementById('reading').value = '';
            document.getElementById('expression').value = '';
            document.getElementById('grammar').value = '';
            document.getElementById('test').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('resultSection').classList.remove('show');
        }
    </script>
</body>
</html>
