// 전문가 톤으로 변환하는 핵심 함수
function transformToExpert(text, type, name) {
    if (!text || text.trim() === '') return '';

    let s = text.trim();

    // 이미 전문가 톤이면 그대로 반환
    if (s.endsWith('습니다.') || s.endsWith('합니다.') || s.endsWith('겠습니다.') || s.endsWith('바랍니다.')) {
        return s;
    }

    // 기본 정리
    s = s.replace(/[.。,，]+$/, '');
    s = s.replace(/^[-•·]\s*/, '');

    if (type === 'praise') {
        // 칭찬 변환

        // "이해도가 훌륭함" 패턴
        if (s.includes('이해도') && s.includes('훌륭')) {
            let topic = s.replace(/.*?(\S+(?:의|에 대한|에 대해)?)?\s*(?:구조와 해석에 대해|에 대해|에 대한)?\s*이해도가?\s*훌륭.*/, '$1').trim();
            if (topic && topic.length > 1) {
                return topic + ' 구조와 해석에 대한 이해도가 매우 뛰어났습니다. 개념을 정확히 파악하고 있어 앞으로의 학습이 더욱 기대됩니다.';
            }
            return '학습 내용에 대한 이해도가 매우 뛰어났습니다. 개념을 정확히 파악하고 있어 앞으로의 학습이 더욱 기대됩니다.';
        }

        // "마무리 했음/마무리했음" 패턴
        if (s.includes('마무리') && (s.includes('했음') || s.includes('함'))) {
            // 핵심 내용 추출
            let content = s.replace(/특히,?\s*/, '').replace(/마무리\s*했음.*$/, '').replace(/마무리\s*함.*$/, '').trim();
            if (content.length > 5) {
                return content + ' 마무리했습니다. 학습에 대한 성실한 태도가 돋보입니다.';
            }
            return '오늘 학습 내용을 훌륭하게 마무리했습니다. 꾸준한 노력이 좋은 결과로 이어지고 있습니다.';
        }

        // "~완성해옴/완성해왔음" 패턴
        if (s.includes('완성') && (s.includes('옴') || s.includes('왔'))) {
            s = s.replace(/완성해\s*옴/, '완성해 왔습니다');
            s = s.replace(/완성해\s*왔음/, '완성해 왔습니다');
            if (!s.endsWith('.')) s += '.';
            if (s.includes('숙제') || s.includes('과제')) {
                s += ' 과제에 대한 책임감이 돋보이는 모습입니다.';
            }
            return s;
        }

        // "~했음" 일반 패턴 (마지막에서 찾기)
        let match = s.match(/(.+)\s*했음$/);
        if (match) {
            return match[1].trim() + '했습니다. 이러한 노력이 실력 향상으로 이어질 것입니다.';
        }

        // "~함" 일반 패턴
        match = s.match(/(.+)\s*함$/);
        if (match) {
            return match[1].trim() + '했습니다. 이러한 자세가 매우 바람직합니다.';
        }

        // "~음" 일반 패턴
        if (s.endsWith('음')) {
            return s.slice(0, -1) + '습니다. 앞으로도 이 모습 그대로 꾸준히 노력해 주길 바랍니다.';
        }
        if (s.endsWith('됨')) {
            return s.slice(0, -1) + '되었습니다. 지속적인 발전이 기대됩니다.';
        }

        return s + '하는 모습을 보여주었습니다. 앞으로도 이러한 자세를 유지해 주길 바랍니다.';
    }

    if (type === 'improve') {
        // 개선점 변환

        // "다만" 제거
        s = s.replace(/^다만,?\s*/, '');

        // "혼동하고 있음" 패턴
        if (s.includes('혼동') && s.includes('있음')) {
            let topic = s.replace(/(.+?)[을를이가은는]\s*혼동.*/, '$1').trim();
            if (topic && topic.length > 2) {
                return topic + '을 구분하는 부분에서 다소 혼동이 있었습니다. 해당 내용은 유사한 개념들을 비교 정리하는 시간을 통해 명확히 구분할 수 있도록 지도하겠습니다.';
            }
            return '일부 개념을 구분하는 과정에서 혼동이 있었습니다. 반복 연습을 통해 정확하게 구분할 수 있도록 지도해 나가겠습니다.';
        }

        // "~어려워함/어려워했음" 패턴
        if (s.includes('어려') && (s.includes('했음') || s.includes('함') || s.includes('워함'))) {
            let topic = s.replace(/(.+?)[을를에서이가]\s*어려워.*/, '$1').trim();
            if (topic && topic.length > 1) {
                return topic + ' 부분에서 다소 어려움을 겪었습니다. 기초 개념부터 차근차근 복습하며 이해도를 높여 나가겠습니다.';
            }
            return '일부 내용에서 어려움을 겪는 모습이 보였습니다. 해당 부분을 집중적으로 보충 지도하겠습니다.';
        }

        // "~있음" 패턴
        if (s.endsWith('있음')) {
            return s.slice(0, -2) + '있는 부분이 관찰되었습니다. 이 부분은 추가 연습을 통해 보완해 나가겠습니다.';
        }

        // "~함" 패턴
        if (s.endsWith('함')) {
            return s.slice(0, -1) + '하는 경향이 있었습니다. 관련 내용을 집중적으로 복습하여 개선해 나가겠습니다.';
        }

        // "~음" 패턴
        if (s.endsWith('음')) {
            return s.slice(0, -1) + '는 부분이 있었습니다. 해당 영역에 대한 추가 지도를 진행하겠습니다.';
        }

        return s + ' 부분에 대해 보충 학습을 진행할 예정입니다.';
    }

    if (type === 'home') {
        // 가정학습 변환

        // "오늘" 제거
        let originalS = s;
        s = s.replace(/^오늘\s*/, '');

        // "~학습함/배움" 패턴
        if (s.includes('학습') || s.includes('배') || s.includes('연습')) {
            let topic = '';

            // "~에 대해 학습함" 패턴
            let match = s.match(/(.+?)\s*(?:에 대해|을|를)?\s*학습/);
            if (match) topic = match[1];

            if (!topic) {
                match = s.match(/(.+?)\s*(?:을|를)?\s*배/);
                if (match) topic = match[1];
            }

            if (topic && topic.length > 1) {
                topic = topic.replace(/^오늘\s*/, '');
                return '오늘 수업에서는 ' + topic + '에 대해 학습했습니다. 가정에서 해당 내용을 한 번 더 복습해 주시면 학습 효과가 배가됩니다.';
            }

            return '오늘 배운 내용을 가정에서 복습해 주시면 학습 효과가 높아집니다.';
        }

        // "포인트/집중" 패턴
        if (s.includes('포인트') || s.includes('집중')) {
            return '오늘 학습한 핵심 포인트를 가정에서 다시 한번 확인해 주시면 좋겠습니다.';
        }

        // "~했음" 패턴
        let match = s.match(/(.+)\s*했음$/);
        if (match) {
            return '오늘 ' + match[1].trim() + '했습니다. 관련 내용을 가정에서 복습해 주시면 도움이 됩니다.';
        }

        // "~함" 패턴
        match = s.match(/(.+)\s*함$/);
        if (match) {
            return '오늘 ' + match[1].trim() + '했습니다. 가정에서도 꾸준히 연습해 주시면 실력 향상에 큰 도움이 됩니다.';
        }

        // "~음" 패턴
        if (s.endsWith('음')) {
            return '오늘 ' + s.slice(0, -1) + '습니다. 해당 내용을 복습해 주시면 좋겠습니다.';
        }

        return '오늘 ' + s + '에 대해 학습했습니다. 복습 부탁드립니다.';
    }

    return s;
}

// 중복 제거 함수
function removeDuplicates(arr) {
    let seen = new Set();
    return arr.filter(item => {
        // 문장의 핵심 부분만 추출하여 비교 (앞 30자)
        let key = item.substring(0, 30);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    });
}

function parseInput(text) {
    let d = {name:'', textbook:'', progress:'', homework:'', vocabulary:'', reading:'', expression:'', grammar:'', test:'', notes:''};
    let lines = text.split('\n');
    let notes = [];

    for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        let lower = line.toLowerCase();
        if (lower.startsWith('학생이름') || lower.startsWith('학생 이름') || lower.startsWith('이름')) {
            d.name = line.split(/\s+/).slice(1).join(' ').trim();
        } else if (lower.startsWith('교재')) {
            d.textbook = line.split(/\s+/).slice(1).join(' ').trim();
        } else if (lower.startsWith('진도')) {
            d.progress = line.split(/\s+/).slice(1).join(' ').trim();
        } else if (lower.startsWith('과제')) {
            let val = line.split(/\s+/).slice(1).join(' ').trim();
            if (val.includes('완료')) d.homework = val.includes('부분') ? '부분완료' : val.includes('미') ? '미완료' : '완료';
        } else if (lower.startsWith('단어')) {
            d.vocabulary = line.split(/\s+/).slice(1).join(' ').trim().toUpperCase();
        } else if (lower.startsWith('본문')) {
            d.reading = line.split(/\s+/).slice(1).join(' ').trim().toUpperCase();
        } else if (lower.startsWith('표현')) {
            d.expression = line.split(/\s+/).slice(1).join(' ').trim().toUpperCase();
        } else if (lower.startsWith('문법')) {
            d.grammar = line.split(/\s+/).slice(1).join(' ').trim().toUpperCase();
        } else if (lower.startsWith('테스트')) {
            d.test = line.split(/\s+/).slice(1).join(' ').trim().toUpperCase();
        } else {
            notes.push(line);
        }
    }
    d.notes = notes.join('\n');
    return d;
}

function getEval(g) {
    if (['A', 'A+'].includes(g)) return '우수';
    if (['B', 'B+'].includes(g)) return '보통';
    if (g) return '미흡';
    return '';
}

function pick(arr, n) {
    return [...arr].sort(() => 0.5 - Math.random()).slice(0, n);
}

function getLevel(d) {
    let g = [];
    ['vocabulary', 'reading', 'expression', 'grammar', 'test'].forEach(k => {
        if (d[k]) {
            if (['A', 'A+'].includes(d[k])) g.push(3);
            else if (['B', 'B+'].includes(d[k])) g.push(2);
            else g.push(1);
        }
    });
    if (!g.length) return 'good';
    let a = g.reduce((x, y) => x + y, 0) / g.length;
    if (a >= 2.5) return 'excellent';
    if (a >= 1.5) return 'good';
    return 'needs';
}

function generateReport() {
    let input = document.getElementById('inputText').value.trim();
    if (!input) { alert('학생 정보를 입력해주세요.'); return; }

    let d = parseInput(input);
    if (!d.name) { alert('학생 이름을 입력해주세요.'); return; }
    if (!d.textbook) { alert('교재를 입력해주세요.'); return; }
    if (!d.progress) { alert('진도를 입력해주세요.'); return; }

    let r = [], i = 1;
    r.push(d.name + ' 학생 Daily Study Report 보내드립니다', '', '교재 및 진도 현황', '사용 교재: ' + d.textbook, '학습 진도: ' + d.progress, '', '학습 평가 결과', '');

    if (d.homework) {
        r.push(i + '. 과제수행 완성도');
        if (d.homework === '완료') r.push('(O) 완료 / ( ) 미완료 / ( ) 부분완료');
        else if (d.homework === '미완료') r.push('( ) 완료 / (O) 미완료 / ( ) 부분완료');
        else r.push('( ) 완료 / ( ) 미완료 / (O) 부분완료');
        r.push(''); i++;
    }
    if (d.vocabulary) { r.push(i + '. 단어 테스트 결과', '등급: ' + d.vocabulary, '평가: ' + getEval(d.vocabulary), ''); i++; }
    if (d.reading) { r.push(i + '. 본문 테스트 결과', '등급: ' + d.reading, '평가: ' + getEval(d.reading), ''); i++; }
    if (d.expression) { r.push(i + '. 표현확장연습 결과', '등급: ' + d.expression, '평가: ' + getEval(d.expression), ''); i++; }
    if (d.grammar) { r.push(i + '. 문법 테스트 결과', '등급: ' + d.grammar, '평가: ' + getEval(d.grammar), ''); i++; }
    if (d.test) { r.push(i + '. 전체 테스트 결과', '등급: ' + d.test, '평가: ' + getEval(d.test), ''); }

    // 칭찬할 점
    let lv = getLevel(d);
    let praiseArr = pick(PRAISE[lv], 3).map(x => x.replace('{name}', d.name));

    // 긍정적 특이사항 추가
    if (d.notes) {
        let posLines = d.notes.split('\n').filter(l =>
            /열심히|잘|좋|적극|발전|향상|훌륭|이해도|완성|뛰어|우수|마무리/.test(l) &&
            !/다만|혼동|어려|부족/.test(l)
        );
        if (posLines.length > 0) {
            let transformed = transformToExpert(posLines[0], 'praise', d.name);
            praiseArr.push(transformed);
        }
    }
    // 중복 제거 후 출력
    praiseArr = removeDuplicates(praiseArr);
    r.push('칭찬할 점', praiseArr.join(' '), '');

    // 개선이 필요한 부분
    let areas = [];
    if (d.vocabulary && getEval(d.vocabulary) !== '우수') areas.push('vocabulary');
    if (d.reading && getEval(d.reading) !== '우수') areas.push('reading');
    if (d.expression && getEval(d.expression) !== '우수') areas.push('expression');
    if (d.grammar && getEval(d.grammar) !== '우수') areas.push('grammar');

    // 성적이 모두 우수하면 excellent 카테고리 사용
    let allExcellent = areas.length === 0;
    if (allExcellent) areas = ['excellent'];

    let impArr = [];
    areas.slice(0, 2).forEach(a => { if (IMPROVE[a]) impArr.push(...pick(IMPROVE[a], 1)); });
    if (impArr.length < 1) impArr.push(...pick(IMPROVE.excellent, 1));

    // 개선점 특이사항 추가
    if (d.notes) {
        let negLines = d.notes.split('\n').filter(l => /어려|힘들|부족|실수|헷갈|혼동|다만/.test(l));
        if (negLines.length > 0) {
            let transformed = transformToExpert(negLines[0], 'improve', d.name);
            impArr.push(transformed);
        }
    }
    // 중복 제거 후 출력
    impArr = removeDuplicates(impArr);
    r.push('개선이 필요한 부분', impArr.join(' '), '');

    // 가정에서의 학습 제안
    let homeArr = [];

    // 학습 내용 특이사항을 먼저 추가 (문장 순서 개선)
    let studyTransformed = '';
    if (d.notes) {
        let studyLines = d.notes.split('\n').filter(l => /학습|배움|배웠|연습|포인트|집중/.test(l) && !/다만|혼동|어려/.test(l));
        if (studyLines.length > 0) {
            studyTransformed = transformToExpert(studyLines[0], 'home', d.name);
            homeArr.push(studyTransformed);
        }
    }

    // 성적이 모두 우수하면 excellent 카테고리 사용
    if (allExcellent) {
        homeArr.push(...pick(HOME.excellent, 1));
    } else {
        areas.slice(0, 1).forEach(a => { if (HOME[a]) homeArr.push(...pick(HOME[a], 1)); });
    }
    homeArr.push(...pick(HOME.encourage, 1));

    // 중복 제거 후 출력
    homeArr = removeDuplicates(homeArr);
    r.push('가정에서의 학습 제안', homeArr.join(' '));

    document.getElementById('reportOutput').value = r.join('\n');
    document.getElementById('resultSection').classList.add('show');
}

function copyReport() {
    let t = document.getElementById('reportOutput').value;
    navigator.clipboard.writeText(t).then(() => {
        let n = document.getElementById('copyNotice');
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 2000);
    }).catch(() => {
        document.getElementById('reportOutput').select();
        document.execCommand('copy');
        let n = document.getElementById('copyNotice');
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 2000);
    });
}

function clearAll() {
    document.getElementById('inputText').value = '';
    document.getElementById('reportOutput').value = '';
    document.getElementById('resultSection').classList.remove('show');
}
